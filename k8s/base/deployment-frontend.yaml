apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-frontend
  labels:
    app: campus-frontend
    app.kubernetes.io/name: campus-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: campusboard
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 80
  selector:
    matchLabels:
      app: campus-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: campus-frontend
        app.kubernetes.io/name: campus-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: campusboard
    spec:
      serviceAccountName: campus-frontend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: web
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: web
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: web
          configMap:
            name: campus-config
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
