apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: campus-api
  labels:
    app: campus-api
    app.kubernetes.io/name: campus-api
    app.kubernetes.io/part-of: campusboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: campus-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
